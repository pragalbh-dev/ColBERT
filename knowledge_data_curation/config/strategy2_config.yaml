# Strategy 2: Synthetic Factsheet Generation Configuration
# This config enables BOTH Strategy 1 (subchain generation) AND Strategy 2 (synthetic factsheets)
# Strategy 2 works IN ADDITION to Strategy 1, not instead of it

paths:
  industry_data: "data/industry_df_quickie.csv"
  factsheet_data: "data/company_factsheets_df_quickie.csv"
  output_dir: "output/"

# OpenAI Configuration
openai:
  model_chain_cleaner: "gpt-4o-mini"
  model_negative_generator: "gpt-4o-mini"
  model_factsheet_generator: "gpt-4"  # Use GPT-4 for higher quality synthetic factsheets
  parallel_threads: 8
  batch_size: 20
  rate_limit: 100

# Elasticsearch Configuration
elasticsearch:
  host: "localhost"
  port: 9200
  index_name: "industry_chains_quickie"
  embedding_model: "text-embedding-3-small"

# Negative Sampling Configuration
sampling:
  hard_negative_count: 5
  soft_negative_count: 5
  nearest_neighbors: 50
  window_size: 10
  samples_per_window: 2

# Scoring Configuration
scoring:
  strategy: "binary"  # Options: "binary", "reranker"
  reranker_model: "BAAI/bge-reranker-large"

# STRATEGY 1: Subchain Generation Configuration (ENABLED)
# This generates subchains from existing industry chains using sliding window
subchain_generation:
  enabled: true  # ✅ Keep Strategy 1 enabled alongside Strategy 2
  configurations:
    - window_size: 1     # Individual categories  
      shift: 1
      enabled: true
    - window_size: 3     # 3-category subchains
      shift: 2           # Step by 2
      enabled: true
  deduplicate_subchains: true

# STRATEGY 2: Synthetic Factsheet Generation Configuration (NEW)
# This generates synthetic company factsheets for underrepresented industry chains
# Works on BOTH original chains AND subchains generated by Strategy 1
synthetic_generation:
  enabled: true
  min_companies_threshold: 5        # Minimum companies per chain to avoid synthetic generation
  target_factsheets_per_chain: 10   # Target number of factsheets to generate per underrepresented chain
  max_sample_factsheets: 2          # Maximum sample factsheets to use as examples
  enable_cache: true                # Enable caching of generated data
  reuse_existing: true              # Reuse existing cached data if configuration hasn't changed
  cache_filename: "synthetic_factsheets.json"
  
  # Optimized parallelization settings
  factsheets_per_call: 4            # Generate 3 factsheets per LLM call (reduces token usage)
  parallel_chains: 4                # Process 4 chains simultaneously 
  max_parallel_calls: 20            # Total parallel capacity
  
  # Output file configurations
  output_files:
    augmented_industry_data: "augmented_industry_data.csv"
    augmented_factsheet_data: "augmented_factsheet_data.csv"
    synthetic_generation_stats: "synthetic_generation_stats.json"
  
  # Quality control settings
  quality_control:
    min_factsheet_length: 100       # Minimum expected length for valid factsheets
    max_retries_per_chain: 3        # Maximum retries if generation fails
    validation_enabled: true        # Enable validation of generated factsheets

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_logging: true
  log_file: "logs/strategy2_pipeline.log" 